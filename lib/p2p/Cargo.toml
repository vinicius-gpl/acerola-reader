[lib]
crate-type = ["lib"]
name = "acerola_p2p"

[package]
authors = ["Vinícius Gabriel Pereira Leitão"]
description = "Biblioteca central P2P para o Acerola — compartilhada entre desktop e mobile"
edition = "2021"
license = "MPL-2.0"
name = "acerola-p2p"
version = "0.0.6"

[features]
default = ["iroh"]
iroh = ["dep:iroh", "dep:iroh-mdns-address-lookup"]
iroh-blobs-adapter = ["dep:iroh-blobs", "dep:irpc", "dep:n0-error", "iroh"]

[dependencies]
async-trait = "0.1.89"
blake3 = "1.8.5"
futures = "0.3.32"
getrandom = "0.4"
iroh = {version = "1.0.3", optional = true}
iroh-blobs = {version = "0.103.0", optional = true}
iroh-mdns-address-lookup = {version = "0.5.0", optional = true}
irpc = {version = "0.17.0", optional = true}
log = "0.4"
n0-error = {version = "1.0.0", optional = true}
rand = "0.10.1"
secrecy = "0.10.3"
serde = {version = "1", features = ["derive"]}
serde_json = "1"
thiserror = "2.0.18"
tokio = {version = "1.52.1", features = ["full"]}
tokio-stream = "0.1.18"
tokio-util = {version = "0.7.18", features = ["codec"]}
tracing = "0.1.44"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.23", features = ["fmt"] }
uuid = {version = "1.23.1", features = ["v5"]}

[dev-dependencies]
criterion = { version = "0.8", features = ["async_tokio"] }
proptest = "1.6"

[[bench]]
name = "throughput"
harness = false