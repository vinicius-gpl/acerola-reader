name: "Desktop/Tests"

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'acerola/desktop/**'
      - 'lib/p2p/**'
      - '.github/workflows/desktop-tests.yml'
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'acerola/desktop/**'
      - 'lib/p2p/**'
      - '.github/workflows/desktop-tests.yml'
  workflow_dispatch:

jobs:
  rust:
    name: Rust Tests
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: acerola/desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('acerola/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Cargo test tools
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/cargo-make.exe
            ~/.cargo/bin/cargo-nextest.exe
            ~/.cargo/bin/cargo-llvm-cov.exe
          key: ${{ runner.os }}-cargo-test-tools-v2

      - name: Install Cargo test tools
        run: |
          $cargoBin = "$HOME/.cargo/bin"
          New-Item -ItemType Directory -Force $cargoBin | Out-Null

          if (!(Test-Path "$cargoBin/cargo-make.exe")) {
            cargo install cargo-make --locked
          }

          if (!(Test-Path "$cargoBin/cargo-nextest.exe")) {
            cargo install cargo-nextest --locked
          }

          if (!(Test-Path "$cargoBin/cargo-llvm-cov.exe")) {
            cargo install cargo-llvm-cov --locked
          }

          Add-Content -Path $env:GITHUB_PATH -Value $cargoBin

      - name: Cache Rust test target
        uses: actions/cache@v6
        with:
          path: acerola/desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-target-rust-${{ hashFiles('acerola/desktop/src-tauri/Cargo.lock', 'acerola/desktop/src-tauri/Cargo.toml', 'acerola/desktop/src-tauri/Makefile.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-rust-

      - name: Run Rust checks and tests
        run: cargo make --cwd ./src-tauri ci

      - name: Run Rust coverage
        run: cargo make --cwd ./src-tauri coverage

      - name: Upload Rust coverage report
        uses: actions/upload-artifact@v7
        with:
          name: rust-lcov
          path: acerola/desktop/src-tauri/lcov.info

  check:
    name: Svelte Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: acerola/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25.9.0
          cache: npm
          cache-dependency-path: acerola/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

  lint:
    name: Svelte Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: acerola/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25.9.0
          cache: npm
          cache-dependency-path: acerola/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  unit:
    name: Svelte Unit tests + coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: acerola/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25.9.0
          cache: npm
          cache-dependency-path: acerola/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests with coverage
        run: npm run test:coverage:unit

      - name: Upload Svelte coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: svelte-coverage
          path: acerola/desktop/coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: acerola/desktop/coverage/lcov.info
          flags: desktop-svelte
          token: ${{ secrets.CODECOV_TOKEN }}

  integration:
    name: Svelte Integration (real browser)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: acerola/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 25.9.0
          cache: npm
          cache-dependency-path: acerola/desktop/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('acerola/desktop/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Integration tests
        run: npm run test:integration

  storybook:
    name: Storybook (stories as tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: acerola/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25.9.0
          cache: npm
          cache-dependency-path: acerola/desktop/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('acerola/desktop/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Storybook tests
        run: npm run test:storybook

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: acerola/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25.9.0
          cache: npm
          cache-dependency-path: acerola/desktop/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('acerola/desktop/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: acerola/desktop/playwright-report
