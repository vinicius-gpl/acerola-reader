name: "Release/Desktop"

on:
  push:
    tags:
      - 'desktop/**/v*'
  workflow_dispatch:
    inputs:
      channel:
        description: "Canal da release"
        required: true
        type: choice
        options:
          - alpha
          - beta
          - prod
      version:
        description: "Versão a liberar (ex: 1.0.0) — cria a tag desktop/<canal>/v<versão> e publica a release de verdade"
        required: true
        type: string

jobs:
  release:
    name: Build & Release (Windows)
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: acerola/desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: acerola/desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            acerola/desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('acerola/desktop/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: npm ci

      - name: Extract version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANNEL="${{ inputs.channel }}"
            VERSION="${{ inputs.version }}"
          else
            CHANNEL=$(echo "$GITHUB_REF_NAME" | cut -d'/' -f2)
            VERSION=$(echo "$GITHUB_REF_NAME" | cut -d'/' -f3 | sed 's/^v//')
          fi
          TAG_NAME="desktop/${CHANNEL}/v${VERSION}"
          echo "CHANNEL=$CHANNEL" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

      - name: Install cargo-make
        uses: davidB/rust-cargo-make@v1

      - name: Update versions (tauri.conf.json, Cargo.toml, package.json)
        working-directory: ${{ github.workspace }}
        run: cargo make bump-desktop
        env:
          VERSION: ${{ env.VERSION }}

      - name: Install winapp
        run: npm install -g @microsoft/winappcli

      - name: Initialize MSIX & Generate Certificate
        run: >
          npm run make --
          -e MSIX_PACKAGE_NAME="${{ secrets.MSIX_PACKAGE_NAME }}"
          -e MSIX_PUBLISHER="${{ secrets.MSIX_PUBLISHER }}"
          -e MSIX_PUBLISHER_DISPLAY_NAME="${{ secrets.MSIX_PUBLISHER_DISPLAY_NAME }}"
          -e MSIX_VERSION="${{ env.VERSION }}.0"
          init-msix

      - name: Build and Package (EXE, MSI, MSIX)
        run: npm run make cd

      - name: Rename Artifacts
        shell: powershell
        run: |
          Rename-Item (Get-Item ".bin\windows\msix\*.msix").FullName "acerola-x64-${{ env.VERSION }}.msix"
          Rename-Item (Get-Item ".bin\windows\msi\*.msi").FullName "acerola-x64-${{ env.VERSION }}.msi"
          Rename-Item (Get-Item ".bin\windows\exe\*.exe").FullName "acerola-x64-${{ env.VERSION }}.exe"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Acerola Desktop v${{ env.VERSION }}
          draft: false
          prerelease: ${{ env.CHANNEL != 'prod' }}
          files: |
            acerola/desktop/.bin/windows/msix/acerola-x64-${{ env.VERSION }}.msix
            acerola/desktop/.bin/windows/msi/acerola-x64-${{ env.VERSION }}.msi
            acerola/desktop/.bin/windows/exe/acerola-x64-${{ env.VERSION }}.exe
          generate_release_notes: true

      - name: Commit version bump
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add acerola/desktop/src-tauri/tauri.conf.json acerola/desktop/src-tauri/Cargo.toml acerola/desktop/package.json
          if ! git diff --staged --quiet; then
            git commit -m "[chore](desktop): bump version to ${{ env.VERSION }} [skip ci]"
            BUMP_SHA=$(git rev-parse HEAD)
            git push origin HEAD:main
            git fetch origin develop
            git checkout -B develop origin/develop
            git cherry-pick "$BUMP_SHA"
            git push origin develop
          fi
