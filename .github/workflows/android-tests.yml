name: "Android/Tests"

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'acerola/android/**'
      - 'lib/p2p/**'
      - '.github/workflows/android-tests.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'acerola/android/**'
      - 'lib/p2p/**'
      - '.github/workflows/android-tests.yml'
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Install cargo-make
        run: cargo install cargo-make --locked

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: acerola/android

      - name: Run unit tests
        run: ./gradlew test
        working-directory: acerola/android

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            acerola/android/**/build/reports/tests/
            acerola/android/**/build/test-results/
          retention-days: 7

      - name: Generate coverage report (Kover)
        run: ./gradlew koverXmlReport
        working-directory: acerola/android

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: acerola/android/build/reports/kover/report.xml
          flags: android
          token: ${{ secrets.CODECOV_TOKEN }}
