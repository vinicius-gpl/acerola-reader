name: "Desktop/JS Mutation Tests"

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  stryker:
    name: Stryker (hooks/state/services/utils)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: acerola/desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25.9.0
          cache: npm
          cache-dependency-path: acerola/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Stryker
        run: npm run test:mutation

      - name: Debug sandbox tsconfig (temporary)
        if: failure()
        run: |
          echo "--- .stryker-tmp sandbox dirs ---"
          find .stryker-tmp -maxdepth 1 -type d
          SANDBOX=$(find .stryker-tmp -maxdepth 1 -type d -name "sandbox*" | head -1)
          echo "--- sandbox: $SANDBOX ---"
          echo "--- ls sandbox root ---"
          ls -la "$SANDBOX"
          echo "--- tsconfig.json (sandbox root) ---"
          cat "$SANDBOX/tsconfig.json" || echo "MISSING"
          echo "--- .svelte-kit dir listing ---"
          ls -la "$SANDBOX/.svelte-kit" || echo "MISSING .svelte-kit"
          echo "--- .svelte-kit/tsconfig.json ---"
          cat "$SANDBOX/.svelte-kit/tsconfig.json" || echo "MISSING .svelte-kit/tsconfig.json"
          echo "--- node_modules/vite/node_modules/rolldown is symlink? ---"
          ls -la "$SANDBOX/node_modules/vite/node_modules" | grep rolldown || true
          readlink -f "$SANDBOX/node_modules/vite/node_modules/rolldown" || true

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stryker-mutants-report
          path: acerola/desktop/mutants.out
