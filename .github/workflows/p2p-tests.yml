name: "P2P/Tests"

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'lib/p2p/**'
      - '.github/workflows/p2p-tests.yml'
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'lib/p2p/**'
      - '.github/workflows/p2p-tests.yml'
  schedule:
    - cron: '0 0 * * 0' # Semanal (todo domingo à meia-noite)
  workflow_dispatch:

jobs:
  test-build:
    name: Build & Test (Rust)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: lib/p2p

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-make
        uses: davidB/rust-cargo-make@v1

      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            lib/p2p/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('lib/p2p/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo make build

      - name: Run Clippy
        run: cargo clippy --all-features -- -D warnings

      - name: Run tests
        run: cargo make test-ci

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lib/p2p

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate Code Coverage
        run: cargo llvm-cov --all-features --lcov --output-path lcov.info


      - name: Check Minimum Coverage Gate (80%)
        run: cargo llvm-cov report --fail-under-lines 80

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lib/p2p/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

  mutation-test:
    name: Cargo Mutants
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lib/p2p

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-mutants
        run: cargo install --locked cargo-mutants

      - name: Run mutation tests
        run: cargo mutants --package acerola-p2p --output mutants-out

      - name: Upload Mutants Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutants-report
          path: lib/p2p/mutants-out/
