name: "Docs/Web Tests"

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'docs/web/**'
      - '.github/workflows/docs-web-tests.yml'
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'docs/web/**'
      - '.github/workflows/docs-web-tests.yml'
  workflow_dispatch:

jobs:
  test:
    name: Unit + Storybook + Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25.9.0
          cache: npm
          cache-dependency-path: docs/web/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('docs/web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Unit + Storybook tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-web-coverage
          path: docs/web/coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: docs/web/coverage/lcov.info
          flags: docs-web
          token: ${{ secrets.CODECOV_TOKEN }}

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25.9.0
          cache: npm
          cache-dependency-path: docs/web/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('docs/web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build (includes Pagefind indexing)
        run: npm run build

      - name: Run Playwright e2e
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-web-playwright-report
          path: docs/web/playwright-report
