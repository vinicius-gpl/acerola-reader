name: "Deploy/Docs/Web"

on:
  push:
    tags:
      - 'docs/**/v*'
  workflow_dispatch:
    inputs:
      channel:
        description: "Canal da release"
        required: true
        type: choice
        options:
          - alpha
          - beta
          - prod
      version:
        description: "Versão a liberar (ex: 1.0.0) — cria a tag docs/<canal>/v<versão> e publica o deploy"
        required: true
        type: string

jobs:
  deploy:
    name: Build & Deploy (Cloudflare)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: docs/web

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANNEL="${{ inputs.channel }}"
            VERSION="${{ inputs.version }}"
          else
            CHANNEL=$(echo "${{ github.ref_name }}" | cut -d'/' -f2)
            VERSION=$(echo "${{ github.ref_name }}" | cut -d'/' -f3 | sed 's/^v//')
          fi
          echo "CHANNEL=$CHANNEL" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG_NAME=docs/${CHANNEL}/v${VERSION}" >> $GITHUB_ENV

      - name: Create and push tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ env.TAG_NAME }}"
          git push origin "${{ env.TAG_NAME }}"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: docs/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install cargo-make
        uses: davidB/rust-cargo-make@v1

      - name: Update version (package.json)
        working-directory: ${{ github.workspace }}
        run: cargo make bump-docs
        env:
          VERSION: ${{ env.VERSION }}

      - name: Build (includes Pagefind indexing)
        run: npm run build

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: docs/web
          command: deploy
