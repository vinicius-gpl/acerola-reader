name: "Deploy/Docs/Web"

on:
  push:
    tags:
      - 'docs/**/v*'

jobs:
  deploy:
    name: Build & Deploy (Cloudflare)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: docs/web

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract version
        run: |
          CHANNEL=$(echo "${{ github.ref_name }}" | cut -d'/' -f2)
          VERSION=$(echo "${{ github.ref_name }}" | cut -d'/' -f3 | sed 's/^v//')
          echo "CHANNEL=$CHANNEL" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG_NAME=docs/${CHANNEL}/v${VERSION}" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: docs/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install cargo-make
        uses: davidB/rust-cargo-make@v1

      - name: Update version (package.json)
        working-directory: ${{ github.workspace }}
        run: cargo make bump-docs
        env:
          VERSION: ${{ env.VERSION }}

      - name: Build (includes Pagefind indexing)
        run: npm run build

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: docs/web
          command: deploy

      - name: Commit version bump
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/web/package.json
          if ! git diff --staged --quiet; then
            git commit -m "[chore](docs): bump version to ${{ env.VERSION }} [skip ci]"
            BUMP_SHA=$(git rev-parse HEAD)

            until git push origin HEAD:main; do
              git fetch origin main
              git rebase origin/main
            done

            git fetch origin develop
            git checkout -B develop origin/develop
            git cherry-pick "$BUMP_SHA"
            until git push origin develop; do
              git fetch origin develop
              git rebase origin/develop
            done
          fi

  deploy-storybook-web:
    name: Deploy Storybook (Web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/web

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: docs/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        run: npm run build-storybook

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: docs/web
          command: deploy --config wrangler.storybook.toml

  deploy-storybook-desktop:
    name: Deploy Storybook (Desktop)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: acerola/desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: acerola/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        run: npm run build-storybook

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: acerola/desktop
          command: deploy --config wrangler.storybook.toml
