name: "Release/P2P"

on:
  push:
    tags:
      - 'p2p/**/v*'

jobs:
  build-release:
    name: Build Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: lib/p2p

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      - name: Install cargo-make
        uses: davidB/rust-cargo-make@v1

      - name: Extract version
        shell: bash
        run: |
          VERSION=$(echo "${{ github.ref_name }}" | cut -d'/' -f3 | sed 's/^v//')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Update version (Cargo.toml)
        working-directory: ${{ github.workspace }}
        run: cargo make bump-p2p
        env:
          VERSION: ${{ env.VERSION }}

      - name: Build Release
        run: cargo make build-release

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-build
          path: lib/p2p/target/release/

      - name: Commit version bump
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/p2p/Cargo.toml
          if ! git diff --staged --quiet; then
            git commit -m "[chore](p2p): bump version to ${{ env.VERSION }} [skip ci]"
            BUMP_SHA=$(git rev-parse HEAD)
            git push origin HEAD:main
            git fetch origin develop
            git checkout -B develop origin/develop
            git cherry-pick "$BUMP_SHA"
            git push origin develop
          fi
