name: "Release/Android"

on:
  push:
    tags:
      - 'android/**/v*'

jobs:
  release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract version
        run: |
          CHANNEL=$(echo "${{ github.ref_name }}" | cut -d'/' -f2)
          VERSION=$(echo "${{ github.ref_name }}" | cut -d'/' -f3 | sed 's/^v//')
          VERSION_CODE=$(git tag -l 'android/*/v*' | wc -l | tr -d ' ')
          TAG_NAME="android/${CHANNEL}/v${VERSION}"
          echo "CHANNEL=$CHANNEL" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      - name: Install cargo-make
        uses: davidB/rust-cargo-make@v1

      - name: Update build.gradle.kts
        run: cargo make bump-android
        env:
          VERSION: ${{ env.VERSION }}
          VERSION_CODE: ${{ env.VERSION_CODE }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/acerola
        working-directory: acerola/android

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: acerola/android

      - name: Build release APK
        run: ./gradlew assembleRelease
        working-directory: acerola/android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/acerola/android/app/acerola
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/acerola-${{ env.VERSION }}.apk"
        working-directory: acerola/android

      - name: Commit version bump
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add acerola/android/app/build.gradle.kts
          if ! git diff --staged --quiet; then
            git commit -m "[chore](android): bump version to ${{ env.VERSION }} [skip ci]"
            BUMP_SHA=$(git rev-parse HEAD)
            git checkout -- .

            until git push origin HEAD:main; do
              git fetch origin main
              git checkout -- .
              git rebase origin/main
            done

            git fetch origin develop
            git checkout -B develop origin/develop
            git cherry-pick "$BUMP_SHA"
            git checkout -- .
            until git push origin develop; do
              git fetch origin develop
              git checkout -- .
              git rebase origin/develop
            done
          fi

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: acerola/android/app/build/outputs/apk/release/acerola-${{ env.VERSION }}.apk
          name: "Acerola Android v${{ env.VERSION }}"
          generate_release_notes: true
          prerelease: ${{ env.CHANNEL != 'prod' }}
