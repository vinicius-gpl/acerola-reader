name: "Release/Android"

on:
  push:
    tags:
      - 'android/*/v*'
  workflow_dispatch:
    inputs:
      channel:
        description: "Canal da release"
        required: true
        type: choice
        options:
          - alpha
          - beta
          - prod
      version:
        description: "Versão a liberar (ex: 1.0.0) — cria a tag android/<canal>/v<versão> e publica a release de verdade"
        required: true
        type: string

jobs:
  release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANNEL="${{ inputs.channel }}"
            VERSION="${{ inputs.version }}"
          else
            CHANNEL=$(echo "${{ github.ref_name }}" | cut -d'/' -f2)
            VERSION=$(echo "${{ github.ref_name }}" | cut -d'/' -f3 | sed 's/^v//')
          fi
          VERSION_CODE=$(git tag -l 'android/*/v*' | wc -l | tr -d ' ')
          TAG_NAME="android/${CHANNEL}/v${VERSION}"
          echo "CHANNEL=$CHANNEL" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      - name: Install cargo-make
        uses: davidB/rust-cargo-make@v1

      - name: Update build.gradle.kts
        run: cargo make bump-android
        env:
          VERSION: ${{ env.VERSION }}
          VERSION_CODE: ${{ env.VERSION_CODE }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/acerola
        working-directory: acerola/android

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: acerola/android

      - name: Build release APK
        run: ./gradlew assembleRelease
        working-directory: acerola/android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/acerola/android/app/acerola
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          if ! git diff --staged --quiet; then
            git commit -m "[chore](android): bump version to ${{ env.VERSION }} [skip ci]"
            git push origin HEAD:main HEAD:develop
          fi
        working-directory: acerola/android

      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/acerola.apk
        working-directory: acerola/android

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: acerola/android/app/build/outputs/apk/release/acerola.apk
          name: "Acerola Android v${{ env.VERSION }}"
          generate_release_notes: true
          prerelease: ${{ env.CHANNEL != 'prod' }}
