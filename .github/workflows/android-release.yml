name: "[android] Release"

on:
  push:
    tags:
      - 'v*(android)'

jobs:
  release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract version from tag
        run: |
          VERSION_FULL=$(echo "${{ github.ref_name }}" | sed 's/^v//; s/(android)$//')
          VERSION=$(echo "$VERSION_FULL" | sed 's/-/ /g')
          VERSION_CODE=$(git tag -l 'v*(android)' | wc -l | tr -d ' ')
          echo "VERSION_FULL=$VERSION_FULL" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV

      - name: Update build.gradle.kts
        run: |
          sed -i "s/versionName = \".*$/versionName = \"${{ env.VERSION }}\"/" app/build.gradle.kts
          sed -i "s/versionCode = [0-9]*/versionCode = ${{ env.VERSION_CODE }}/" app/build.gradle.kts
        working-directory: acerola/android

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/acerola
        working-directory: acerola/android

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: acerola/android

      - name: Build release APK
        run: ./gradlew assembleRelease
        working-directory: acerola/android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/acerola/android/app/acerola
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          if ! git diff --staged --quiet; then
            git commit -m "[chore](android): bump version to ${{ env.VERSION }} [skip ci]"
            git push origin HEAD:main HEAD:develop
          fi
        working-directory: acerola/android

      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/acerola.apk
        working-directory: acerola/android

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: acerola/android/app/build/outputs/apk/release/acerola.apk
          name: "Acerola Android ${{ github.ref_name }}"
          generate_release_notes: true
          prerelease: ${{ contains(env.VERSION_FULL, '-') }}
