[package]
authors = ["Vinícius Gabriel Pereira Leitão"]
description = "Aplicativo para ler e gerenciar bibliotecas de quadrinhos locais."
edition = "2021"
license = "MPL-2.0"
name = "acerola"
version = "0.0.1"

# NOTE: Em rust para baixar libs cargo build
[lib]
# WARN: Sufixo _lib é para não dar conflito de binário
# Desktop-only: o binario linka esta lib como rlib. staticlib/cdylib ficam para mobile/FFI
# e geram artefatos enormes no debug do Windows, principalmente acerola_lib.lib/.pdb.
crate-type = ["rlib"]
name = "acerola_lib"

[[bin]]
name = "acerola"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = {version = "2", features = ["isolation"] }

[dependencies]
acerola-p2p = { path = "../../../lib/p2p", features = ["iroh", "iroh-blobs-adapter"] }
anyhow = "1.0.102"
async-trait = "0.1.89"
axum = "0.8.8"
chrono = "0.4.44"
futures = "0.3.32"
aes-gcm = "0.10"
image = "0.25.10"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
log = "0.4"
lru = "0.18.0"
mdns-sd = "0.18.2"
once_cell = "1.21"
pdfium-render = { version = "0.9", features = ["thread_safe"] }
quick-xml = { version = "0.37.5", features = ["serialize"] }
rand = "0.8"
regex = "1.12.3"
reqwest = { version = "0.12", features = ["json"] }
serde = {version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = "0.8.6"
tauri = {version = "2", features = ["protocol-asset", "isolation"] }
tauri-plugin-dialog = "2.7.0"
tauri-plugin-fs = "2"
tauri-plugin-log = "2.9.0"
tauri-plugin-opener = "2"
tauri-plugin-sql = {version = "2", features = ["sqlite"] }
tauri-plugin-store = "2"
thiserror = "2.0.18"
tokio = {version = "1.52.1", features = ["full"] }
tokio-stream = "0.1.18"
tokio-util = {version = "0.7.18", features = ["codec"] }
tracing = {version = "0.1.44", features = ["log"] }
unrar = "0.5.8"
zip = "8.6.0"

[target.'cfg(windows)'.dependencies]
windows = {version = "0.58", features = ["ApplicationModel"] }

[dev-dependencies]
tauri = {version = "2", features = ["protocol-asset", "test"] }
tempfile = "3"
