# Tarefas de manutenção do monorepo inteiro. Requer cargo-make: `cargo install cargo-make`.
# Rode com `cargo make <task>` a partir da raiz do repo.

# ==========================================
# Bump de versão por componente (usado pelas Actions de release/deploy)
# ==========================================

[tasks.bump-android]
description = "Atualiza versionName/versionCode do Android a partir das env vars VERSION e VERSION_CODE"
script_runner = "node"
script_extension = "js"
script = '''
const fs = require("fs");
const path = "acerola/android/app/build.gradle.kts";
let content = fs.readFileSync(path, "utf8");
content = content.replace(/versionName = ".*"/, `versionName = "${process.env.VERSION}"`);
content = content.replace(/versionCode = \d+/, `versionCode = ${process.env.VERSION_CODE}`);
fs.writeFileSync(path, content);
'''

[tasks.bump-desktop]
description = "Atualiza a versão do Desktop (tauri.conf.json, Cargo.toml, package.json) a partir da env var VERSION"
script_runner = "node"
script_extension = "js"
script = '''
const fs = require("fs");
const version = process.env.VERSION;

const tauriPath = "acerola/desktop/src-tauri/tauri.conf.json";
const tauri = JSON.parse(fs.readFileSync(tauriPath, "utf8"));
tauri.version = version;
fs.writeFileSync(tauriPath, JSON.stringify(tauri, null, 2) + "\n");

const pkgPath = "acerola/desktop/package.json";
const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
pkg.version = version;
fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + "\n");

const cargoPath = "acerola/desktop/src-tauri/Cargo.toml";
let cargo = fs.readFileSync(cargoPath, "utf8");
cargo = cargo.replace(/^version = ".*"/m, `version = "${version}"`);
fs.writeFileSync(cargoPath, cargo);
'''

[tasks.bump-docs]
description = "Atualiza a versão da documentação (package.json) a partir da env var VERSION"
script_runner = "node"
script_extension = "js"
script = '''
const fs = require("fs");
const pkgPath = "docs/web/package.json";
const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
pkg.version = process.env.VERSION;
fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + "\n");
'''

[tasks.bump-p2p]
description = "Atualiza a versão do P2P (Cargo.toml) a partir da env var VERSION"
script_runner = "node"
script_extension = "js"
script = '''
const fs = require("fs");
const path = "lib/p2p/Cargo.toml";
let content = fs.readFileSync(path, "utf8");
content = content.replace(/^version = ".*"/m, `version = "${process.env.VERSION}"`);
fs.writeFileSync(path, content);
'''

[tasks.clean]
clear = true
description = "Remove o target/ de todos os crates Rust do monorepo (lib/p2p, lib/relay, desktop, android)"
script_runner = "@duckscript"
script = '''
paths = array lib/p2p/target lib/relay/target acerola/desktop/src-tauri/target acerola/android/native/rust/target

for path in ${paths}
    exists = is_path_exists ${path}
    if ${exists}
        rm -r ${path}
        echo Removido: ${path}
    else
        echo Ja limpo: ${path}
    end
end
'''
